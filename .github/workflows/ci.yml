# CI/CD: przy każdym push i pull requeście buduje backend i frontend,
# uruchamia testy jednostkowe (xUnit) oraz sprawdza, czy obrazy Docker się budują.
# Po udanym CI na gałęzi main publikuje obrazy w GitHub Container Registry,
# a serwer (Azure) przez SSH pobiera gotowe obrazy i restartuje kontenery.
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    name: Backend – build i testy (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore WarehouseSystem.slnx
      - name: Build
        run: dotnet build WarehouseSystem.slnx --no-restore --configuration Release
      - name: Testy (xUnit)
        run: dotnet test WarehouseSystem.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend – lint i build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/warehouse-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/warehouse-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Obrazy Docker
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/g1xx
      # Obrazy wysyłamy do rejestru tylko po push na main; pull requesty tylko budujemy.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Logowanie do GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.REGISTRY }}/wms-backend:latest,${{ env.REGISTRY }}/wms-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.REGISTRY }}/wms-frontend:latest,${{ env.REGISTRY }}/wms-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy na serwer (Azure)
    runs-on: ubuntu-latest
    needs: [ docker ]
    # Tylko po push na main — pull requesty są sprawdzane, ale nie wdrażane.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-production
    steps:
      - name: Wdrożenie przez SSH (pobranie gotowych obrazów, bez budowania na serwerze)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key && ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "set -e; cd '$DEPLOY_PATH'; git pull --ff-only; docker compose pull backend frontend; docker compose up -d --no-build; docker image prune -f"
