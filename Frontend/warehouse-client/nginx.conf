server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter) owns client-side routes like /admin/inventory —
    # any path nginx doesn't have a static file for must fall back to index.html,
    # otherwise a hard refresh (or a bookmarked deep link) 404s instead of letting
    # the SPA's own router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints build output (e.g. index-abc123.js), so it's safe to cache
    # these aggressively — a new deploy ships new filenames. index.html itself is
    # NOT matched here and keeps nginx's default (short-lived) caching, so a new
    # deploy is picked up without requiring a hard refresh.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
