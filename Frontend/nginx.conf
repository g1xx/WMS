server {
    listen 80;
    server_name wms.polandcentral.cloudapp.azure.com;

    root /usr/share/nginx/html;
    index index.html;

    # axiosClient.ts's baseURL is the relative path "/api" — this is what makes
    # that resolve to the real backend. Same-origin from the browser's point of
    # view (no CORS involved), backend:8080 reached over the internal compose
    # network (no public port needed for it — see docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Kept accurate even though this deployment is HTTP-only for now, so
        # nothing needs to change here once a TLS-terminating layer is added
        # in front — see Program.cs's ForwardedHeaders note.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A bare "/inbound" (no trailing slash) doesn't match the prefix location below —
    # nginx location matching is literal, "/inbound/" is not a prefix of "/inbound" —
    # so without this it fell through to location / (warehouse-client's own catch-all),
    # which resolved it as a directory and 301'd with a malformed double-slash
    # Location header. An exact-match location has the highest precedence in nginx
    # (always wins over prefix/regex matches), so this always runs first for the
    # literal path and issues a clean, explicit redirect instead.
    location = /inbound {
        return 301 /inbound/;
    }

    # TestOrderGenerator — the simulated upstream ERP/marketplace order feed. Built
    # with base: '/inbound/' (see its vite.config.ts) so its own asset references
    # already resolve under this prefix; index.html fallback here isn't load-bearing
    # today (it has no client-side router of its own) but costs nothing to keep,
    # same pattern as the main app below.
    location /inbound/ {
        try_files $uri $uri/ /inbound/index.html;
    }

    # React Router (BrowserRouter) owns client-side routes like /admin/inventory —
    # any path nginx doesn't have a static file for must fall back to index.html,
    # otherwise a hard refresh (or a bookmarked deep link) 404s instead of letting
    # the SPA's own router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints build output (e.g. index-abc123.js), so it's safe to cache
    # these aggressively — a new deploy ships new filenames. index.html itself is
    # NOT matched here and keeps nginx's default (short-lived) caching, so a new
    # deploy is picked up without requiring a hard refresh.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
