# Local & production-shaped deployment for the WMS.
#
# Quick start: `docker compose up --build`
#   - frontend: http://localhost   (nginx, serving the Vite build; also proxies /api
#     to `backend` internally — see Frontend/warehouse-client/nginx.conf)
#   - backend:  http://127.0.0.1:5124/api — loopback-only, for local debugging
#     (Swagger, curl) from on the host itself, or via an SSH tunnel on a remote
#     box; the browser never calls this directly, see nginx.conf
#   - db:       127.0.0.1:5432 — loopback-only, same reasoning as backend
#
# frontend is the only service meant to be reachable from outside the host. db and
# backend are bound to 127.0.0.1 specifically (not just "published, but firewalled
# elsewhere") so they're never internet-reachable even if the host firewall/NSG is
# ever misconfigured — belt and suspenders, not a substitute for the firewall.
#
# All secrets below have safe local-dev defaults via `${VAR:-default}` so this runs
# out of the box with no setup. For a real deployment, copy .env.example to .env and
# override at least POSTGRES_PASSWORD and JWT_SECRET — see .env.example for details.

services:
  db:
    image: postgres:16-alpine
    container_name: wms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_db}
    volumes:
      - wms_db_data:/var/lib/postgresql/data
    ports:
      # Loopback-only (127.0.0.1, not 0.0.0.0) — reachable from `psql`/a GUI client
      # on the host itself, never from outside it. `backend` reaches `db` over the
      # internal compose network regardless, so this mapping is purely for humans;
      # safe to remove it entirely for a stricter posture.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-warehouse_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: wms_backend
    restart: unless-stopped
    depends_on:
      db:
        # Not just "container started" — waits for pg_isready, so EF Core's
        # Database.Migrate() on startup (see Program.cs) isn't racing Postgres.
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # "Server=" (not "Host=") to match the exact key style already used in
      # appsettings.json's ConnectionStrings:DefaultConnection — Npgsql accepts
      # both, this just keeps the two consistent. Host is the `db` service name,
      # resolved via the compose network, not localhost.
      ConnectionStrings__DefaultConnection: "Server=db;Port=5432;Database=${POSTGRES_DB:-warehouse_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      JwtSettings__Secret: ${JWT_SECRET:-SuperSecretKeyForWarehouseProjectWhichNeedsToBeLongEnough123!}
      JwtSettings__Issuer: ${JWT_ISSUER:-WarehouseApi}
      JwtSettings__Audience: ${JWT_AUDIENCE:-WarehouseClient}
    ports:
      # Loopback-only (127.0.0.1, not 0.0.0.0) — not required for the app itself,
      # since the browser reaches the backend through nginx's /api proxy (same
      # origin as the frontend), never this port directly. Kept for local
      # debugging (Swagger UI, curl, a REST client) from on the host itself.
      - "127.0.0.1:5124:8080"

  frontend:
    build:
      context: ./Frontend/warehouse-client
      dockerfile: Dockerfile
    container_name: wms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Deliberately bound to all interfaces (0.0.0.0), not just loopback — this
      # is the one service actually meant to be reachable from outside the host.
      # 80 by default; swap the host side for "3000:80" if 80 is already taken
      # locally. CORS on the backend already allows both (see Program.cs).
      - "80:80"

volumes:
  wms_db_data:
